name: Build KITSUNE EQ

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dsp-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build and run DSP tests
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra Tests/dsp_test.cpp -o dsp_test
          ./dsp_test

  windows:
    needs: dsp-tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Read version from CMakeLists.txt
        id: ver
        shell: bash
        run: echo "version=$(grep -oP 'project\(KitsuneEQ VERSION \K[0-9.]+' CMakeLists.txt)" >> "$GITHUB_OUTPUT"

      - name: Configure
        run: cmake -B build -A x64
      - name: Build
        run: cmake --build build --config Release

      - name: Validate VST3 with pluginval (non-blocking)
        continue-on-error: true
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval
          ./pluginval/pluginval.exe --strictness-level 5 --validate-in-process --timeout-ms 120000 "build/KitsuneEQ_artefacts/Release/VST3/KITSUNE EQ.vst3"

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          & $iscc "/DAppVersion=${{ steps.ver.outputs.version }}" "/DBuildDir=$PWD\build\KitsuneEQ_artefacts\Release" "/DOutDir=$PWD\dist" installer\windows\KitsuneEQ.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v5
        with:
          name: KitsuneEQ-Windows-Installer
          path: dist/KitsuneEQ-*-Windows-Setup.exe
      - uses: actions/upload-artifact@v5
        with:
          name: KitsuneEQ-Windows-VST3-portable
          path: build/KitsuneEQ_artefacts/Release/VST3/

  macos:
    needs: dsp-tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Read version from CMakeLists.txt
        id: ver
        run: echo "version=$(sed -nE 's/^project\(KitsuneEQ VERSION ([0-9.]+)\)/\1/p' CMakeLists.txt)" >> "$GITHUB_OUTPUT"

      - name: Configure (universal: Apple Silicon + Intel)
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
      - name: Build
        run: cmake --build build --config Release

      - name: Build installer (.pkg)
        run: installer/macos/build-pkg.sh "${{ steps.ver.outputs.version }}" build/KitsuneEQ_artefacts/Release dist

      - uses: actions/upload-artifact@v5
        with:
          name: KitsuneEQ-macOS-Installer
          path: dist/*.pkg

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: KitsuneEQ-*-Installer
          path: release
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
